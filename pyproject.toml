[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flick_urban"
dynamic = ["version"]
description = "Fast urban wind modelling via neural networks"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
authors = [
    {name = "Fabian Hernández", email = "fabian.alexis.hernandez@upc.edu"},
    {name = "Josep María Duró"},
    {name = "Arnau Miró"},
    {name = "Oriol Lehmkul"},
    {name = "Ivette Rodríguez"},
]
keywords = ["urban wind", "CFD", "neural network", "UNet", "urban climate", "wind modelling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.21.6",
    "scipy>=1.5.4",
    "h5py",
    "matplotlib",
    "pandas",
    "numpy-stl",
    "ifcopenshell",
]

[project.optional-dependencies]
gpu  = ["torch>=1.12"]
hpc  = ["mpi4py", "pyqvarsi"]
geo  = ["osmnx", "geopandas", "pyproj", "laspy", "pdal", "pyarrow", "rtree", "requests"]
dev  = ["pytest"]
docs = ["sphinx", "sphinx-rtd-theme", "myst-parser", "sphinx-autodoc-typehints"]

[project.urls]
Homepage = "https://github.com/fabianhr21/FLICK"
Repository = "https://github.com/fabianhr21/FLICK"
Issues = "https://github.com/fabianhr21/FLICK/issues"

[tool.setuptools.dynamic]
version = {attr = "flick_urban.__version__"}

[tool.setuptools.packages.find]
include = ["flick_urban*"]

[tool.pytest.ini_options]
testpaths = ["Testsuite"]
